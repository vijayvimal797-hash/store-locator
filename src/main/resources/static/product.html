<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #333; }

        header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white; padding: 20px 40px;
            display: flex; align-items: center; gap: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        header .logo { font-size: 28px; }
        header h1 { font-size: 22px; font-weight: 600; }
        header p { font-size: 12px; opacity: 0.6; margin-top: 2px; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 30px; }
        .back { display: inline-block; margin-bottom: 20px; color: #555;
                text-decoration: none; font-size: 14px; }
        .back:hover { color: #1a1a2e; }

        .card {
            background: white; border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 1px solid #e8edf2;
            display: flex;
        }

        .card-img {
            width: 420px; min-height: 380px;
            object-fit: cover; flex-shrink: 0;
        }

        .card-body { padding: 36px; flex: 1; }

        .category-badge {
            display: inline-block; background: #f0f4f8;
            color: #555; padding: 4px 12px;
            border-radius: 20px; font-size: 12px;
            margin-bottom: 14px; font-weight: 500;
        }

        .card-body h2 { font-size: 26px; font-weight: 700;
                        color: #1a1a2e; margin-bottom: 10px; }
        .card-body .desc { font-size: 15px; color: #777;
                           margin-bottom: 24px; line-height: 1.6; }

        .price { font-size: 32px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
        .price-note { font-size: 13px; color: #aaa; margin-bottom: 30px; }

        .divider { border: none; border-top: 1px solid #f0f4f8; margin: 24px 0; }

        .btn {
            display: block; background: #1a1a2e; color: white;
            padding: 14px; border-radius: 10px;
            border: none; font-size: 15px; font-weight: 600;
            cursor: pointer; width: 100%; text-align: center;
            transition: background 0.2s;
        }
        .btn:hover { background: #2d2d5e; }

        .info-row { display: flex; gap: 20px; margin-bottom: 24px; }
        .info-box {
            flex: 1; background: #f8fafc; border-radius: 10px;
            padding: 14px; text-align: center;
        }
        .info-box .label { font-size: 11px; color: #aaa; margin-bottom: 4px; text-transform: uppercase; }
        .info-box .value { font-size: 14px; font-weight: 600; color: #333; }

        /* Reviews Section */
        .reviews-section {
            margin-top: 40px; background: white;
            border-radius: 16px; padding: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 1px solid #e8edf2;
        }

        .reviews-section h3 {
            font-size: 18px; font-weight: 700;
            color: #1a1a2e; margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e8f0fe;
        }

        .review-card {
            padding: 16px; background: #f8fafc;
            border-radius: 10px; margin-bottom: 12px;
            border: 1px solid #e8edf2;
        }

        .review-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 8px;
        }

        .review-user { font-weight: 600; font-size: 14px; color: #1a1a2e; }
        .review-date { font-size: 11px; color: #aaa; }
        .stars { color: #FFB300; font-size: 16px; margin-bottom: 6px; }
        .review-comment { font-size: 14px; color: #666; line-height: 1.5; }

        .no-reviews { text-align: center; padding: 30px; color: #aaa; font-size: 14px; }

        /* Add Review Form */
        .add-review {
            margin-top: 24px; padding-top: 24px;
            border-top: 1px solid #f0f4f8;
        }

        .add-review h4 { font-size: 15px; font-weight: 600;
                         color: #1a1a2e; margin-bottom: 14px; }

        .star-select { display: flex; gap: 8px; margin-bottom: 14px; }
        .star-select span {
            font-size: 28px; cursor: pointer;
            color: #ddd; transition: color 0.2s;
        }
        .star-select span.active { color: #FFB300; }

        textarea {
            width: 100%; padding: 12px;
            border: 1.5px solid #e0e0e0; border-radius: 8px;
            font-size: 14px; resize: none; outline: none;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin-bottom: 12px; transition: border 0.2s;
        }
        textarea:focus { border-color: #1a1a2e; }

        .submit-btn {
            background: #1a1a2e; color: white;
            padding: 11px 24px; border-radius: 8px;
            border: none; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .submit-btn:hover { background: #2d2d5e; }
        .review-msg { margin-top: 10px; font-size: 13px; color: green; }

        footer { text-align: center; padding: 30px;
                 color: #aaa; font-size: 12px; margin-top: 40px; }
    </style>
</head>
<body>

<header>
    <div class="logo">🛍️</div>
    <div style="flex:1">
        <h1>StoreLocator</h1>
        <p>Find products available in stores near you</p>
    </div>
    <div style="text-align:right">
        <span style="font-size:13px;opacity:0.8" id="welcomeMsg"></span>
    </div>
</header>

<div class="container">
    <a class="back" href="/index.html">← Back to Products</a>
    <div class="card" id="productCard">
        <p style="padding:40px;color:#aaa">Loading...</p>
    </div>

    <!-- Reviews Section -->
    <div class="reviews-section">
        <h3>⭐ Ratings & Reviews</h3>
        <div id="reviewsList"></div>

        <!-- Add Review Form -->
        <div class="add-review">
            <h4>Write a Review</h4>
            <div class="star-select" id="starSelect">
                <span onclick="setRating(1)">★</span>
                <span onclick="setRating(2)">★</span>
                <span onclick="setRating(3)">★</span>
                <span onclick="setRating(4)">★</span>
                <span onclick="setRating(5)">★</span>
            </div>
            <textarea id="commentInput" rows="3"
                placeholder="Share your experience with this product..."></textarea>
            <button class="submit-btn" onclick="submitReview()">
                Submit Review
            </button>
            <div class="review-msg" id="reviewMsg"></div>
        </div>
    </div>
</div>

<footer>© 2026 StoreLocator. All rights reserved.</footer>

<script>
    // Check login
    if (!localStorage.getItem('userId')) {
        window.location.href = 'login.html';
    }

    document.getElementById('welcomeMsg').textContent =
        'Hello, ' + localStorage.getItem('name') + '!';

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    let selectedRating = 0;

    // Load product
    fetch(`http://localhost:8080/api/products/${productId}`)
        .then(res => res.json())
        .then(p => {
            document.title = p.name;
            document.getElementById('productCard').innerHTML = `
                <img class="card-img" src="${p.imageUrl}" alt="${p.name}"
                     onerror="this.src='https://via.placeholder.com/420x380?text=No+Image'"/>
                <div class="card-body">
                    <span class="category-badge">${p.category}</span>
                    <h2>${p.name}</h2>
                    <p class="desc">${p.description}</p>
                    <div class="info-row">
                        <div class="info-box">
                            <div class="label">Category</div>
                            <div class="value">${p.category}</div>
                        </div>
                        <div class="info-box">
                            <div class="label">Availability</div>
                            <div class="value">In Stores</div>
                        </div>
                    </div>
                    <div class="price">₹${p.price.toLocaleString()}</div>
                    <p class="price-note">Inclusive of all taxes</p>
                    <hr class="divider"/>
                    <button class="btn" onclick="findStores(${p.id})">
                        📍 Find in Nearby Store
                    </button>
                </div>`;
        });

    // Load reviews
    function loadReviews() {
        fetch(`http://localhost:8080/api/reviews/${productId}`)
            .then(res => res.json())
            .then(reviews => {
                const list = document.getElementById('reviewsList');
                if (reviews.length === 0) {
                    list.innerHTML = `<div class="no-reviews">
                        No reviews yet. Be the first to review!</div>`;
                    return;
                }
                list.innerHTML = '';
                reviews.forEach(r => {
                    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                    const date = new Date(r.createdDate).toLocaleDateString('en-IN');
                    list.innerHTML += `
                        <div class="review-card">
                            <div class="review-header">
                                <span class="review-user">👤 ${r.username}</span>
                                <span class="review-date">${date}</span>
                            </div>
                            <div class="stars">${stars}</div>
                            <p class="review-comment">${r.comment}</p>
                        </div>`;
                });
            });
    }

    loadReviews();

    // Star rating selection
    function setRating(rating) {
        selectedRating = rating;
        const stars = document.querySelectorAll('#starSelect span');
        stars.forEach((s, i) => {
            s.classList.toggle('active', i < rating);
        });
    }

    // Submit review
    function submitReview() {
        const comment = document.getElementById('commentInput').value.trim();
        const msg = document.getElementById('reviewMsg');

        if (selectedRating === 0) {
            msg.style.color = 'red';
            msg.textContent = 'Please select a star rating!';
            return;
        }
        if (!comment) {
            msg.style.color = 'red';
            msg.textContent = 'Please write a comment!';
            return;
        }

        fetch('http://localhost:8080/api/reviews', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                productId: parseInt(productId),
                userId: parseInt(localStorage.getItem('userId')),
                rating: selectedRating,
                comment: comment
            })
        })
        .then(res => res.text())
        .then(data => {
            msg.style.color = 'green';
            msg.textContent = '✅ Review submitted successfully!';
            document.getElementById('commentInput').value = '';
            setRating(0);
            selectedRating = 0;
            loadReviews();
        });
    }

    // Find stores
    function findStores(productId) {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                window.location.href = `stores.html?productId=${productId}&lat=${lat}&lng=${lng}`;
            }, () => {
                window.location.href = `stores.html?productId=${productId}&lat=13.0827&lng=80.2707`;
            });
        }
    }
</script>
</body>
</html>
