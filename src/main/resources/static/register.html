<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StoreLocator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0fe, #fce4ec);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .card {
            background: white; border-radius: 16px;
            padding: 40px; width: 100%; max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .logo { text-align: center; margin-bottom: 24px; }
        .logo div { font-size: 40px; margin-bottom: 8px; }
        .logo h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; }
        .logo p { font-size: 13px; color: #aaa; margin-top: 4px; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600;
                color: #444; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #e0e0e0; border-radius: 8px;
            font-size: 14px; outline: none;
            transition: border 0.2s;
        }
        input:focus { border-color: #1a1a2e; }

        .btn {
            width: 100%; padding: 13px;
            background: #1a1a2e; color: white;
            border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 6px;
            transition: background 0.2s;
        }
        .btn:hover { background: #2d2d5e; }

        .msg { text-align: center; margin-top: 14px;
               font-size: 13px; color: red; }
        .msg.success { color: green; }

        .bottom { text-align: center; margin-top: 20px;
                  font-size: 13px; color: #888; }
        .bottom a { color: #1a1a2e; font-weight: 600; text-decoration: none; }
        .bottom a:hover { text-decoration: underline; }

        .divider { border: none; border-top: 1px solid #f0f0f0; margin: 20px 0; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div>🛍️</div>
        <h1>StoreLocator</h1>
        <p>Create your account</p>
    </div>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" />
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" />
    </div>

    <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Choose a username" />
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Choose a password" />
    </div>

    <button class="btn" onclick="register()">Create Account</button>
    <div class="msg" id="msg"></div>

    <hr class="divider"/>
    <div class="bottom">
        Already have an account? <a href="login.html">Sign in here</a>
    </div>
</div>

<script>
    function register() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('msg');

        if (!name || !email || !username || !password) {
            msg.textContent = 'Please fill in all fields!';
            return;
        }

        fetch('http://localhost:8080/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, username, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.message === 'Registration successful!') {
                msg.className = 'msg success';
                msg.textContent = 'Registered! Redirecting to login...';
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                msg.textContent = data.message;
            }
        })
        .catch(() => msg.textContent = 'Something went wrong!');
    }
</script>
</body>
</html>
