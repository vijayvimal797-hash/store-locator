<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreLocator - Products</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #333; }

        header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white; padding: 20px 40px;
            display: flex; align-items: center; gap: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        header .logo { font-size: 28px; }
        header h1 { font-size: 22px; font-weight: 600; }
        header p { font-size: 12px; opacity: 0.6; margin-top: 2px; }

        .hero {
            background: linear-gradient(135deg, #e8f0fe, #fce4ec);
            padding: 40px; text-align: center;
        }
        .hero h2 { font-size: 28px; color: #1a1a2e; margin-bottom: 8px; }
        .hero p { color: #666; font-size: 15px; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 30px; }

        .section-title {
            font-size: 18px; font-weight: 600; color: #1a1a2e;
            margin-bottom: 24px; padding-bottom: 10px;
            border-bottom: 2px solid #e8f0fe;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: white; border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border: 1px solid #e8edf2;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .card-img {
            width: 100%; height: 200px;
            object-fit: cover; background: #f0f4f8;
        }

        .card-body { padding: 20px; }
        .card h3 { font-size: 17px; font-weight: 600; color: #1a1a2e; margin-bottom: 6px; }
        .card .desc { font-size: 13px; color: #888; margin-bottom: 8px; }

        .category-badge {
            display: inline-block; background: #f0f4f8;
            color: #555; padding: 3px 10px;
            border-radius: 20px; font-size: 11px;
            margin-bottom: 12px; font-weight: 500;
        }

        .price { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; }

        .btn {
            display: block; background: #1a1a2e; color: white;
            padding: 11px; border-radius: 8px;
            text-decoration: none; font-size: 14px;
            text-align: center; font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover { background: #2d2d5e; }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white; padding: 5px 14px;
            border-radius: 6px; cursor: pointer;
            font-size: 12px; margin-top: 6px;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }

        .rating-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
        .stars { color: #FFB300; font-size: 15px; }
        .rating-count { font-size: 12px; color: #888; }

        .cart-btn {
            background: #f0f4f8; border: 1.5px solid #e0e0e0;
            border-radius: 8px; padding: 11px 14px;
            font-size: 18px; cursor: pointer;
            transition: background 0.2s;
        }
        .cart-btn:hover { background: #e8f0fe; }

        .cart-icon {
            font-size: 22px; cursor: pointer;
            position: relative; text-decoration: none;
        }
        .cart-badge {
            position: absolute; top: -8px; right: -8px;
            background: #e53935; color: white;
            border-radius: 50%; width: 18px; height: 18px;
            font-size: 11px; display: flex;
            align-items: center; justify-content: center;
            font-weight: 700;
        }

        footer {
            text-align: center; padding: 30px;
            color: #aaa; font-size: 12px; margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">🛍️</div>
    <div style="flex:1">
        <h1>StoreLocator</h1>
        <p>Find products available in stores near you</p>
    </div>
    <div style="display:flex;align-items:center;gap:20px">
        <a href="cart.html" class="cart-icon" id="cartIcon">
            🛒
            <span class="cart-badge" id="cartCount">0</span>
        </a>
        <div style="text-align:right">
            <span style="font-size:13px;opacity:0.8" id="welcomeMsg"></span><br>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>
</header>

<div class="hero">
    <h2>Browse Our Products</h2>
    <p>Click on any product to find the nearest store that carries it</p>
</div>

<div class="container">
    <div class="section-title">All Products</div>
    <div class="grid" id="productGrid"></div>
</div>

<footer>© 2026 StoreLocator. All rights reserved.</footer>

<script>
    // Redirect to login if not logged in
    if (!localStorage.getItem('userId')) {
        window.location.href = 'login.html';
    }

    // Show welcome message
    document.getElementById('welcomeMsg').textContent =
        'Hello, ' + localStorage.getItem('name') + '!';

    // Logout function
    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    // Add to cart function
    function addToCart(productId) {
        const userId = localStorage.getItem('userId');
        fetch(`http://localhost:8080/api/cart/add?userId=${userId}&productId=${productId}`, {
            method: 'POST'
        })
        .then(res => res.text())
        .then(msg => {
            updateCartCount();
            alert('✅ Added to cart!');
        });
    }

    // Update cart count in header
    function updateCartCount() {
        const userId = localStorage.getItem('userId');
        fetch(`http://localhost:8080/api/cart/${userId}`)
            .then(res => res.json())
            .then(items => {
                document.getElementById('cartCount').textContent = items.length;
            });
    }

    // Load products
    fetch('http://localhost:8080/api/products')
        .then(res => res.json())
        .then(products => {
            const grid = document.getElementById('productGrid');
            products.forEach(p => {
                const fullStars = Math.floor(p.averageRating);
                const emptyStars = 5 - fullStars;
                const stars = '★'.repeat(fullStars) + '☆'.repeat(emptyStars);
                const ratingText = p.reviewCount > 0
                    ? `<span class="stars">${stars}</span>
                       <span class="rating-count">${p.averageRating} (${p.reviewCount} reviews)</span>`
                    : `<span class="rating-count" style="color:#bbb">No reviews yet</span>`;

                grid.innerHTML += `
                    <div class="card">
                        <img class="card-img" src="${p.imageUrl}" alt="${p.name}"
                             onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'"/>
                        <div class="card-body">
                            <h3>${p.name}</h3>
                            <p class="desc">${p.description}</p>
                            <span class="category-badge">${p.category}</span>
                            <div class="rating-row">${ratingText}</div>
                            <div class="price">₹${p.price.toLocaleString()}</div>
                            <div style="display:flex;gap:8px">
                                <a class="btn" href="product.html?id=${p.id}"
                                   style="flex:1">View Details →</a>
                                <button class="cart-btn" onclick="addToCart(${p.id})">
                                    🛒
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
        });

    // Load cart count on page load
    updateCartCount();
</script>
</body>
</html>
